<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="icon/png" href="img/favicon.png" sizes="64x64" />
    <title>Growfy</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <a href="#" class="header__logo">
            <img src="img/logo.svg" alt="logo" class="logo"
          /></a>
          <nav class="header__menu menu">
            <div class="menu__body">
              <ul class="menu__list">
                <li class="menu__item">
                  <a href="#" class="menu__link">Home</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">About</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Pages</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Services</a>
                </li>
              </ul>
            </div>
          </nav>
          <a href="#" class="header__cart cart-header">
            <span class="cart-header__text">Cart</span>
            <span class="cart-header__quantity">0</span>
          </a>
          <a href="#" class="header__button button">Get started</a>
          <buttom class="icon-menu" type="button">
            <span></span>
          </buttom>
        </div>
      </header>
      <main class="page">
        <section class="page__main main">
          <div class="main__container">
            <div class="main__content">
              <div class="main__header header__main">
                <h1 class="header-main__title">
                  Marketing solutions that grow your business.
                </h1>
                <div class="header-main__text text">
                  <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit,
                    suspendisse varius enim in eros elementum tristique. Duis
                    cursus, mi quis viverra ornare, eros dolor.
                  </p>
                </div>
                <div class="header-main__actions">
                  <a href="" class="header-main__button button">Our services</a>
                  <a href="" class="header-main__button button button__dark"
                    >Contact us</a
                  >
                </div>
              </div>
            </div>
            <div class="main__images images-main">
              <div class="images-main__column">
                <div class="images-main__item images-main__item-1">
                  <img src="img/main/01.jpg" alt="image" />
                </div>
                <div class="images-main__item images-main__item-2">
                  <img src="img/main/02.jpg" alt="image" />
                </div>
              </div>
              <div class="images-main__column">
                <div class="images-main__item images-main__item-3">
                  <img src="img/main/03.jpg" alt="image" />
                </div>
                <div class="images-main__item images-main__item-4">
                  <img src="img/main/04.jpg" alt="image" />
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer"></footer>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
